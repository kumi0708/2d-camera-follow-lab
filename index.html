<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2D Camera Follow Lab — デッドゾーンと先読み</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><span class="logo">◈</span> 2D Camera Follow Lab</h1>
    <p>すべてのモードは「目標（goal）」＋「イージング（ease）」。8種類のカメラ追従を同じ世界で比べられます。</p>
  </header>

  <main>
    <section class="stage">
      <div class="frame">
        <canvas id="view" width="640" height="640"></canvas>
        <div class="hud top"><div id="hud-mode" class="chip"></div></div>
        <div id="hud-stats" class="hud bottom"></div>
      </div>
      <div class="keys">
        <span><kbd>WASD</kbd>/<kbd>↑↓←→</kbd> 移動</span>
        <span><kbd>Shift</kbd> ダッシュ</span>
        <span><kbd>1</kbd>–<kbd>8</kbd> モード</span>
        <span><kbd>IJKL</kbd> 相棒</span>
        <span><kbd>マウス</kbd> エイム</span>
        <span><kbd>G</kbd> デバッグ</span>
        <span><kbd>P</kbd> ピクセルスナップ</span>
        <span><kbd>R</kbd> リセット</span>
      </div>
    </section>

    <aside class="panel">
      <div class="card">
        <h2>カメラモード</h2>
        <div id="modes" class="modes"></div>
        <p id="mode-desc" class="desc"></p>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>パラメータ</h2>
          <button id="reset-params" class="ghost">既定値に戻す</button>
        </div>
        <div id="params"></div>
      </div>

      <div class="card">
        <h2>カメラとプレイヤーのずれ</h2>
        <canvas id="graph" width="300" height="90"></canvas>
        <div class="legend"><span class="lx">■ x</span><span class="ly">■ y</span><span class="muted">±64px / 直近5秒</span></div>
      </div>

      <div class="card">
        <h2>ミニマップ</h2>
        <canvas id="minimap" width="300" height="200"></canvas>
      </div>

      <div class="card">
        <h2>表示</h2>
        <label class="toggle"><input id="opt-debug" type="checkbox"><span>デバッグ表示（目標・箱・範囲）</span></label>
        <label class="toggle"><input id="opt-snap" type="checkbox"><span>ピクセルスナップ（カメラとキャラを整数座標に）</span></label>
        <label class="toggle"><input id="opt-buddy" type="checkbox"><span>相棒スライムを自動で動かす</span></label>
      </div>
    </aside>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
